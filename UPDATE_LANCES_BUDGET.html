<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050913">
<title>Refresh Lance's Budget</title>
<style>
html,body{margin:0;min-height:100%;background:#050913;color:#f7fbff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(430px,100%);box-sizing:border-box;padding:28px;border-radius:24px;background:linear-gradient(155deg,#10223a,#081321);border:1px solid rgba(83,225,255,.3);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.logo{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:26px;font-weight:950;color:#07131d;background:linear-gradient(135deg,#71d7ff,#55e6a5,#8a7dff);margin-bottom:18px}
h1{font-size:25px;margin:0 0 8px}p{color:#9fb0c9;line-height:1.5;margin:0}
.status{margin-top:20px;padding:13px 14px;border-radius:14px;background:#07111f;border:1px solid rgba(83,225,255,.18);font-weight:800}
.good{color:#55e6a5}.bad{color:#ff8a96}
button{display:none;width:100%;margin-top:16px;padding:14px;border:0;border-radius:14px;font-weight:900;background:linear-gradient(135deg,#71d7ff,#55e6a5);color:#07131d;font-size:16px}
.small{font-size:12px;color:#8499b7;margin-top:14px}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<div class="logo">LB</div>
<h1>Refreshing Money OS</h1>
<p>This removes the old app cache only. Your saved bills, paychecks, debts and settings in local storage are not deleted.</p>
<div class="status" id="status">Removing old cached app…</div>
<button id="go">Open fresh app</button>
<div class="small">Force Refresh build v21</div>
</div></div>
<script>
(async()=>{
  const status=document.getElementById('status'),go=document.getElementById('go');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('lances-budget')).map(k=>caches.delete(k)));
    }
    status.textContent='Old cache removed ✓ Opening MONTH SIM v21…';
    status.className='status good';
    setTimeout(()=>location.replace('./index.html?build=21&fresh='+Date.now()),900);
  }catch(e){
    status.textContent='Cache refresh needs one tap.';
    status.className='status bad';
    go.style.display='block';
    go.onclick=()=>location.replace('./index.html?build=21&fresh='+Date.now());
  }
})();
</script>
</body>
</html>
